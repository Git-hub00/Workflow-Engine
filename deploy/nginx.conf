# nginx site for the Workflow Engine SPA (installed to /etc/systemd .../sites by
# deploy_vm.sh). Serves the built SPA at http://VM_HOST/ and reverse-proxies the
# API same-origin under /api/ (so the browser needs NO CORS).
#
# Keycloak: the SPA talks to Keycloak DIRECTLY at http://VM_HOST:8081 (see the
# VITE_KEYCLOAK_URL the pipeline writes). We do NOT route login through /auth/
# because Keycloak behind a path prefix needs KC_HTTP_RELATIVE_PATH=/auth, which
# would (a) break the API's server-side JWKS URL (http://localhost:8081/realms/…)
# and admin-REST paths, and (b) break the Keycloak login page's /resources/ links.
# The API deliberately does not verify the token issuer, so direct :8081 access is
# fully compatible. A pass-through /auth/ block is left below (commented) for teams
# who later enable KC relative-path mode.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/workflow-spa;
    index index.html;

    # SPA: client-side routing — fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — same-origin: /api/v1/... -> http://127.0.0.1:8000/v1/...
    # Trailing slash on proxy_pass strips the /api prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # PDF invoice uploads
        proxy_read_timeout 120s;    # LLM-backed endpoints (extract / narrate)
    }

    # OPTIONAL Keycloak pass-through. Only works correctly if the keycloak
    # container is started with KC_HTTP_RELATIVE_PATH=/auth and KC_PROXY_HEADERS
    # =xforwarded; otherwise the login page's static resources 404. The SPA uses
    # direct :8081 by default, so this stays disabled.
    #
    # location /auth/ {
    #     proxy_pass http://127.0.0.1:8081/auth/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
