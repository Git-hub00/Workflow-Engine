# nginx config for the web container. Serves the built SPA and reverse-proxies
# /api/ to the API container (same-origin, so the browser needs no CORS).
# Unlike the host nginx (which proxied to 127.0.0.1:8000), this proxies to the
# `api` docker service by name.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API same-origin: /api/v1/... -> http://api:8000/v1/...
    # Trailing slash on proxy_pass strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # PDF invoice uploads
        proxy_read_timeout 120s;    # LLM-backed endpoints (extract / narrate)
    }
}
